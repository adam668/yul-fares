name: fares

on:
  schedule:
    # 11:10 UTC = 07:10 in Montreal during EDT, 06:10 during EST.
    # GitHub queues scheduled jobs, so expect it a few minutes late.
    - cron: "10 11 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Limit to these IATA codes, comma separated"
        required: false
        default: ""
      all:
        description: "Scan every route today instead of today's share"
        type: boolean
        default: false

concurrency:
  group: fares
  cancel-in-progress: false

permissions:
  contents: write   # push price history to the data branch
  actions: write    # re-enable this workflow so the schedule never lapses

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The runner is wiped after every job, so price history lives on the
      # `data` branch as one commit that's replaced each run — the repo
      # never accumulates a copy per day. If it can't be fetched, stop:
      # starting from an empty database and saving it would wipe history.
      - name: Restore price history
        id: restore
        run: |
          git fetch --depth 1 origin data
          git show FETCH_HEAD:prices.db > prices.db
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Find fares
        # Under the job limit, so the save and alert steps still get to run.
        timeout-minutes: 200
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ORIGIN: ${{ vars.ORIGIN || 'YUL' }}
          CURRENCY: ${{ vars.CURRENCY || 'CAD' }}
          DISCOUNT_FLOOR: ${{ vars.DISCOUNT_FLOOR || '0.40' }}
          MIN_ABS_SAVING: ${{ vars.MIN_ABS_SAVING || '250' }}
          MAX_PRICE: ${{ vars.MAX_PRICE || '1600' }}
          MAX_DEEP_DIVES: ${{ vars.MAX_DEEP_DIVES || '7' }}
          SCAN_EVERY_DAYS: ${{ vars.SCAN_EVERY_DAYS || '2' }}
          SEND_WHEN_EMPTY: ${{ vars.SEND_WHEN_EMPTY || '0' }}
          DB_PATH: prices.db
        run: python run.py --only "${{ inputs.only }}" ${{ inputs.all && '--all' || '' }}

      # Runs even if the scan failed or timed out part-way, so a bad day
      # doesn't throw away what it did collect.
      - name: Save price history
        if: always() && steps.restore.outputs.restored == 'true'
        run: |
          git config user.name  "fares-bot"
          git config user.email "fares-bot@users.noreply.github.com"
          blob=$(git hash-object -w prices.db)
          tree=$(printf '100644 blob %s\tprices.db\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "prices $(date -u +%F)")
          git push --force origin "$commit:refs/heads/data"

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling on every run resets that clock.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fares.yml/enable"

      - name: Email if the run failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ORIGIN: ${{ vars.ORIGIN || 'YUL' }}
        run: python3 alert.py "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
